name: Build macOS (Apple Silicon)

on:
  workflow_dispatch:
  workflow_call:

jobs:
  build-macos-arm64:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -e ".[build]"
      - name: Build application
        run: |
          VERSION=$(python -c "from app.common.setting import VERSION; print(VERSION)")
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          python deploy.py
      - name: Add aria2 tools
        run: |
          curl -fL "https://github.com/XiaoshuDeXiaowo/GitHub-NetDisk-Tools/releases/download/v0.0.1/macOS-arm64.zip" -o /tmp/tools.zip
          mkdir -p "dist/GitHub-NetDisk.app/Contents/MacOS/tools"
          unzip -o /tmp/tools.zip -d "dist/GitHub-NetDisk.app/Contents/MacOS/tools"
          codesign --force --deep --sign - "dist/GitHub-NetDisk.app"
      - name: Create DMG
        run: |
          mkdir dmg-root
          cp -R "dist/GitHub-NetDisk.app" dmg-root/
          ln -s /Applications dmg-root/Applications
          hdiutil create -srcfolder dmg-root -volname GitHub-NetDisk -format UDZO "GitHub-NetDisk-v$VERSION-macOS-arm64.dmg"
      - uses: actions/upload-artifact@v4
        with:
          name: GitHub-NetDisk-v${{ env.VERSION }}-macOS-arm64
          path: GitHub-NetDisk-v${{ env.VERSION }}-macOS-arm64.dmg
